plugins { id 'com.android.application' }

android { namespace 'com.pipslife.multibot'; compileSdk 35
    defaultConfig { applicationId 'com.pipslife.multibot'; minSdk 26; targetSdk 35; versionCode 15; versionName '1.14' }
    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'log4j2.xml', 'log4j.properties']
        }
    }
}

dependencies {
}
