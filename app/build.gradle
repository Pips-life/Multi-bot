plugins { id 'com.android.application' }

android { namespace 'com.pipslife.multibot'; compileSdk 35
    defaultConfig { applicationId 'com.pipslife.multibot'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.3' }
    packaging {
        resources {
            excludes += ['log4j2.xml']
        }
    }
}

dependencies {
    // Official MetaApi Java SDK. This replaces the hand-written Socket.IO/WebSocket protocol.
    implementation 'cloud.metaapi.sdk:metaapi-java-sdk:14.0.9'
}
