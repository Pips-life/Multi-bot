plugins { id 'com.android.application' }

android { namespace 'com.pipslife.multibot'; compileSdk 35
    defaultConfig { applicationId 'com.pipslife.multibot'; minSdk 26; targetSdk 35; versionCode 6; versionName '1.5' }
    // MetaApi Java SDK 14.x uses Apache HttpClient. Android removed Apache HTTP
    // from the normal boot classpath; explicitly use the platform legacy library
    // so its org.apache.http classes are resolved consistently at runtime.
    useLibrary 'org.apache.http.legacy'
    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'log4j2.xml', 'log4j.properties']
        }
    }
}

dependencies {
    implementation 'cloud.metaapi.sdk:metaapi-java-sdk:14.0.9'
    implementation 'io.vertx:vertx-core:4.5.10'
}
