name: One-time trailing 70 update
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/one-time-trailing70.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixed-sl-tp-direction-20260904
          fetch-depth: 0
      - name: Apply trading and version changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/main.js')
          s=p.read_text()
          s=s.replace("const SL_PIPS=100;", "const INITIAL_SL_PIPS=100;\nconst TRAILING_SL_PIPS=70;")
          s=s.replace("const SPREAD_PIPS=35;\nconst COST_BUFFER_PIPS=10;\nconst BREAK_EVEN_ARM_PIPS=SPREAD_PIPS+COST_BUFFER_PIPS;\nconst LOCK_STEP_1_PIPS=60;\nconst LOCK_STEP_1_PROTECT_PIPS=25;\nconst LOCK_STEP_2_PIPS=100;\nconst LOCK_STEP_2_PROTECT_PIPS=50;\nconst REVERSAL_CONFIRMATIONS=3;", "const SPREAD_PIPS=35;")
          s=s.replace("function trailingStop(side,price){const pip=brokerPipSize(),base=Number(price);if(!Number.isFinite(base)||base<=0)return undefined;return normalizePrice(side==='BUY'?base-SL_PIPS*pip:base+SL_PIPS*pip);}", "function initialStop(side,price){const pip=brokerPipSize(),base=Number(price);if(!Number.isFinite(base)||base<=0)return undefined;return normalizePrice(side==='BUY'?base-INITIAL_SL_PIPS*pip:base+INITIAL_SL_PIPS*pip);}\nfunction trailingStop(side,price){const pip=brokerPipSize(),base=Number(price);if(!Number.isFinite(base)||base<=0)return undefined;return normalizePrice(side==='BUY'?base-TRAILING_SL_PIPS*pip:base+TRAILING_SL_PIPS*pip);}")
          start=s.index('function protectedStop(')
          end=s.index('\nfunction updateProfitLossUI', start)
          s=s[:start]+"function protectedStop(position,current){const side=sideOf(position);return side?trailingStop(side,current):undefined;}"+s[end:]
          s=s.replace("const volume=currentVolume(),reference=side==='BUY'?ask:bid,stopLoss=trailingStop(side,reference);", "const volume=currentVolume(),reference=side==='BUY'?ask:bid,stopLoss=initialStop(side,reference);")
          s=s.replace("setStatus(`OPEN ${side} ${volume} — 3s COOL-OFF | BE @ ${BREAK_EVEN_ARM_PIPS}p | PROFIT LOCK`);", "setStatus(`OPEN ${side} ${volume} — 3s COOL-OFF | SL ${INITIAL_SL_PIPS}p | TRAIL ${TRAILING_SL_PIPS}p`);")
          old="""if(momentumFaded(heldSide)){const count=(reversalCounts.get(heldSide)||0)+1;reversalCounts.set(heldSide,count);const protectedProfit=Number.isFinite(weakestProfit)&&weakestProfit>=BREAK_EVEN_ARM_PIPS;const confirmed=count>=REVERSAL_CONFIRMATIONS;if(protectedProfit&&confirmed){await closeOurs(`CONFIRMED REVERSAL ${heldSide} +${weakestProfit.toFixed(0)}p`);reversalCounts.clear();return;}setStatus(`HOLDING ${positions.length}/${MAX_POSITIONS} ${heldSide} | reversal ${count}/${REVERSAL_CONFIRMATIONS} | lock ${protectedProfit?'ARMED':'WAIT '+BREAK_EVEN_ARM_PIPS+'p'}`);}else{reversalCounts.delete(heldSide);setStatus(`HOLDING ${positions.length}/${MAX_POSITIONS} ${heldSide} | spread ${SPREAD_PIPS}p | BE ${BREAK_EVEN_ARM_PIPS}p | profit lock`);}if(positions.length>=MAX_POSITIONS)return;"""
          new="""if(momentumFaded(heldSide)){await closeOurs(`MOMENTUM CHANGED ${heldSide}`);reversalCounts.clear();return;}else{reversalCounts.delete(heldSide);setStatus(`HOLDING ${positions.length}/${MAX_POSITIONS} ${heldSide} | MOMENTUM HOLDS | TRAIL ${TRAILING_SL_PIPS}p`);}if(positions.length>=MAX_POSITIONS)return;"""
          if old not in s: raise SystemExit('Expected momentum block not found')
          s=s.replace(old,new)
          s=s.replace("const adversePrice=heldSide==='BUY'?bid:ask;const profits=positions.map(p=>profitPips(p,adversePrice)).filter(Number.isFinite);const weakestProfit=profits.length?Math.min(...profits):NaN;", "")
          p.write_text(s)

          g=Path('app/build.gradle')
          gs=g.read_text().replace("versionCode 13; versionName '2.2'", "versionCode 14; versionName '2.3'")
          g.write_text(gs)
          PY
          git config user.name 'Pips-life'
          git config user.email 'piplife1@gmail.com'
          git add web/main.js app/build.gradle
          git commit -m 'Use 100 pip initial SL and 70 pip trailing with momentum exit'
          git push origin fixed-sl-tp-direction-20260904
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-trailing70.yml
          git commit -m 'Remove one-time trailing update workflow'
          git push origin fixed-sl-tp-direction-20260904
