name: Update batch trading cooldown

on:
  push:
    branches: [fixed-sl-tp-direction-20260904]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Apply batch trading cooldown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixed-sl-tp-direction-20260904
          fetch-depth: 0
      - name: Apply batch entry and post-closure cooldown
        shell: python
        run: |
          from pathlib import Path
          p=Path('web/main.js')
          s=p.read_text()
          s=s.replace("// Prevent rapid-fire entries/exits and give the broker/market a short cool-off.\nconst TRADE_COOLDOWN_MS=3000;\nlet lastTradeActionAt=0;", "// After the whole position batch closes, wait 3 seconds before allowing a new batch.\nconst TRADE_COOLDOWN_MS=3000;\nlet lastClosureAt=0;\nlet previousOwnedCount=0;")
          old="""function reconcile(){if(!connection?.terminalState)return;const positions=ownedPositions();const latest=[...positions].sort((a,b)=>positionTime(b)-positionTime(a))[0]||null;ui.position.textContent=positions.length?(positions.length===1?sideOf(latest):`${positions.length}/4 ${sideOf(latest)}`):'—';updateProfitLossUI();}"""
          new="""function reconcile(){if(!connection?.terminalState)return;const positions=ownedPositions();const latest=[...positions].sort((a,b)=>positionTime(b)-positionTime(a))[0]||null;if(previousOwnedCount>0&&positions.length===0){lastClosureAt=Date.now();setStatus('ALL POSITIONS CLOSED — 3s COOL-OFF before next batch');}previousOwnedCount=positions.length;ui.position.textContent=positions.length?(positions.length===1?sideOf(latest):`${positions.length}/4 ${sideOf(latest)}`):'—';updateProfitLossUI();}"""
          if old not in s: raise SystemExit('reconcile pattern not found')
          s=s.replace(old,new)
          old="""async function closePosition(position,reason){const id=idOf(position);if(!id||!connection)return;try{await connection.closePosition(id);lastTradeActionAt=Date.now();setStatus(`CLOSE ${sideOf(position)} — ${reason}`);}catch(e){setStatus(`Close failed: ${e?.message||e}`);}}\nasync function closeOurs(reason){const positions=ownedPositions();if(!positions.length)return;await Promise.all(positions.map(p=>closePosition(p,reason)));}"""
          new="""async function closePosition(position,reason){const id=idOf(position);if(!id||!connection)return;try{await connection.closePosition(id);setStatus(`CLOSE ${sideOf(position)} — ${reason}`);}catch(e){setStatus(`Close failed: ${e?.message||e}`);}}\nasync function closeOurs(reason){const positions=ownedPositions();if(!positions.length)return;await Promise.all(positions.map(p=>closePosition(p,reason)));lastClosureAt=Date.now();setStatus('ALL POSITIONS CLOSE REQUESTS SENT — 3s COOL-OFF');}"""
          if old not in s: raise SystemExit('close pattern not found')
          s=s.replace(old,new)
          old="""async function enter(side,bid,ask){const positions=ownedPositions();if(entryInFlight||positions.length>=MAX_POSITIONS||!connection||!synchronized||!positionDistanceAllows(side,positions))return;if(Date.now()-lastTradeActionAt<TRADE_COOLDOWN_MS){setStatus(`COOL-OFF ${Math.max(0,TRADE_COOLDOWN_MS-(Date.now()-lastTradeActionAt))}ms before next trade`);return;}const volume=currentVolume(),reference=side==='BUY'?ask:bid,stopLoss=initialStop(side,reference);if(!Number.isFinite(stopLoss))return;entryInFlight=true;try{const clientId=`MB_${Date.now().toString(36)}_${Math.floor(Math.random()*36).toString(36)}`,options={comment:`MB ${side}`,magic:MAGIC,clientId};if(side==='BUY')await connection.createMarketBuyOrder(SYMBOL,volume,stopLoss,normalizePrice(reference+TAKE_PROFIT_PIPS*brokerPipSize()),options);else await connection.createMarketSellOrder(SYMBOL,volume,stopLoss,normalizePrice(reference-TAKE_PROFIT_PIPS*brokerPipSize()),options);lastEntryPrice=reference;lastTradeActionAt=Date.now();setStatus(`OPEN ${side} ${volume} — 3s COOL-OFF | SL ${INITIAL_SL_PIPS}p | TP ${TAKE_PROFIT_PIPS}p`);await waitForPosition(side,5000);reconcile();}catch(e){setStatus(`Entry failed: ${e?.message||e}`);}finally{entryInFlight=false;}}"""
          new="""async function enter(side,bid,ask){const positions=ownedPositions();if(entryInFlight||positions.length>=MAX_POSITIONS||!connection||!synchronized||!positionDistanceAllows(side,positions))return;if(Date.now()-lastClosureAt<TRADE_COOLDOWN_MS){const left=TRADE_COOLDOWN_MS-(Date.now()-lastClosureAt);setStatus(`COOL-OFF ${left}ms before next batch`);return;}const slots=Math.max(0,MAX_POSITIONS-positions.length);if(!slots)return;const volume=currentVolume(),reference=side==='BUY'?ask:bid,stopLoss=initialStop(side,reference);if(!Number.isFinite(stopLoss))return;entryInFlight=true;try{const orders=[];for(let i=0;i<slots;i++){const clientId=`MB_${Date.now().toString(36)}_${i}_${Math.floor(Math.random()*36).toString(36)}`,options={comment:`MB ${side}`,magic:MAGIC,clientId};orders.push(side==='BUY'?connection.createMarketBuyOrder(SYMBOL,volume,stopLoss,normalizePrice(reference+TAKE_PROFIT_PIPS*brokerPipSize()),options):connection.createMarketSellOrder(SYMBOL,volume,stopLoss,normalizePrice(reference-TAKE_PROFIT_PIPS*brokerPipSize()),options));}await Promise.all(orders);lastEntryPrice=reference;setStatus(`OPEN BATCH ${side} ${slots} × ${volume} — SL ${INITIAL_SL_PIPS}p | TP ${TAKE_PROFIT_PIPS}p`);await waitForPosition(side,5000);reconcile();}catch(e){setStatus(`Batch entry failed: ${e?.message||e}`);}finally{entryInFlight=false;}}"""
          if old not in s: raise SystemExit('enter pattern not found')
          s=s.replace(old,new)
          s=s.replace("setStatus('BOT RUNNING — spread-aware profit lock + confirmed reversal');", "setStatus('BOT RUNNING — batch execution + confirmed direction');")
          p.write_text(s)
          g=Path('app/build.gradle')
          gs=g.read_text()
          gs=gs.replace('versionCode 17', 'versionCode 18').replace('versionName "2.6"', 'versionName "2.7"')
          g.write_text(gs)
      - name: Commit changes
        run: |
          git config user.name "Pips-life"
          git config user.email "piplife1@gmail.com"
          git add web/main.js app/build.gradle
          git commit -m "Apply batch trading cooldown"
          git push origin fixed-sl-tp-direction-20260904
