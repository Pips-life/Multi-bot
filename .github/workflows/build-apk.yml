name: Build Android APK

on:
  push:
    branches: [ main, fixed-sl-tp-direction-20260904 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply latest trading management
        run: python3 .github/scripts/apply_profit_momentum.py

      - name: Apply broker-validation-safe individual entries
        run: python3 .github/scripts/fix_individual_entries.py

      - name: Apply candle-size directional momentum model
        run: python3 .github/scripts/apply_directional_momentum.py

      - name: Set monotonic release version
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          sed -i -E "s/versionCode [0-9]+; versionName '[^']+'/versionCode ${VERSION_CODE}; versionName '2.10'/" app/build.gradle
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          grep -o "versionCode [0-9]*; versionName '[^']*'" app/build.gradle

      - name: Repair release Gradle file
        run: |
          printf '\n}\n' >> app/build.gradle
          tail -8 app/build.gradle

      - name: Require persistent release signing
        env:
          PIPSLIFE_KEYSTORE_BASE64: ${{ secrets.PIPSLIFE_KEYSTORE_BASE64 }}
          PIPSLIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPSLIFE_KEYSTORE_PASSWORD }}
          PIPSLIFE_KEY_ALIAS: ${{ secrets.PIPSLIFE_KEY_ALIAS }}
          PIPSLIFE_KEY_PASSWORD: ${{ secrets.PIPSLIFE_KEY_PASSWORD }}
        run: |
          if [ -z "${PIPSLIFE_KEYSTORE_BASE64:-}" ] || \
             [ -z "${PIPSLIFE_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${PIPSLIFE_KEY_ALIAS:-}" ] || \
             [ -z "${PIPSLIFE_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Persistent release signing is not configured. Refusing to publish an APK that cannot update over the installed app."
            exit 1
          fi
          echo "$PIPSLIFE_KEYSTORE_BASE64" | base64 --decode > pipslife-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace("signingConfigs { release { } }", "signingConfigs { release { storeFile file('pipslife-release.jks'); storePassword System.getenv('PIPSLIFE_KEYSTORE_PASSWORD'); keyAlias System.getenv('PIPSLIFE_KEY_ALIAS'); keyPassword System.getenv('PIPSLIFE_KEY_PASSWORD') } }")
          s=s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          p.write_text(s)
          PY
          echo "Persistent Pips-life release signing enabled"
          keytool -list -v -keystore pipslife-release.jks -storepass "$PIPSLIFE_KEYSTORE_PASSWORD" -alias "$PIPSLIFE_KEY_ALIAS" | grep -E 'Alias name:|SHA256:'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build MetaApi browser bundle
        run: |
          npm install
          npm run build:web
          test -s web-dist/bundle.js
          mkdir -p app/src/main/assets
          cp web/index.html app/src/main/assets/index.html
          cp web-dist/bundle.js app/src/main/assets/bundle.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
          test -n "${ANDROID_HOME:-}" || exit 1
          test -x "$ANDROID_HOME/platform-tools/adb" || exit 1
          ls -la "$ANDROID_HOME/platforms" | head -20
          ls -la "$ANDROID_HOME/build-tools" | head -20

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: |
          gradle clean assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          test ! -f app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Pips-life-Multi-bot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Multi-bot-trailing-dynamic-exit-release-apk
          path: Pips-life-Multi-bot.apk
          if-no-files-found: error

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_CODE}"
          gh release create "$TAG" Pips-life-Multi-bot.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pips-life Multi-bot 2.10 (${VERSION_CODE})" \
            --notes "Candle-size directional judgement, large-candle retracement entries, individual 200-pip protective SLs, dynamic momentum SL locking, and momentum-based dynamic TP exits. Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}. Persistent release signing enforced." \
            --latest
