name: Build Android APK

on:
  push:
    branches: [ main, fixed-sl-tp-direction-20260904 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply latest trading management
        run: python3 .github/scripts/apply_profit_momentum.py

      - name: Apply broker-validation-safe individual entries
        run: python3 .github/scripts/fix_individual_entries.py

      - name: Set monotonic release version
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          sed -i -E "s/versionCode [0-9]+; versionName '[^']+'/versionCode ${VERSION_CODE}; versionName '2.10'/" app/build.gradle
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          grep -o "versionCode [0-9]*; versionName '[^']*'" app/build.gradle

      - name: Repair release Gradle file
        run: |
          printf '\n}\n' >> app/build.gradle
          tail -8 app/build.gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build MetaApi browser bundle
        run: |
          npm install
          npm run build:web
          test -s web-dist/bundle.js
          mkdir -p app/src/main/assets
          cp web/index.html app/src/main/assets/index.html
          cp web-dist/bundle.js app/src/main/assets/bundle.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
          test -n "${ANDROID_HOME:-}" || exit 1
          test -x "$ANDROID_HOME/platform-tools/adb" || exit 1
          ls -la "$ANDROID_HOME/platforms" | head -20
          ls -la "$ANDROID_HOME/build-tools" | head -20

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: |
          gradle clean assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          test ! -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Pips-life-Multi-bot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Multi-bot-trailing-dynamic-exit-release-apk
          path: Pips-life-Multi-bot.apk
          if-no-files-found: error

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_CODE}"
          gh release create "$TAG" Pips-life-Multi-bot.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pips-life Multi-bot 2.10 (${VERSION_CODE})" \
            --notes "Broker-validation-safe individual entries, dynamic momentum exit, and in-app updater. Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}." \
            --latest
