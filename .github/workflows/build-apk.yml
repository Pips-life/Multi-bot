name: Build Android APK

on:
  push:
    branches: [ main, fixed-sl-tp-direction-20260904 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 100-pip growth room, break-even protection and dynamic +100 exit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('web/main.js')
          s=p.read_text()
          changed=False
          # Remove the overly-sensitive pre-loss exit layer.
          s=re.sub(r"const EARLY_EXIT_LOOKBACK_TICKS=4;\nconst EARLY_EXIT_MIN_PROFIT_PIPS=2;\nconst EARLY_EXIT_MIN_ADVERSE_PIPS=1\.5;\nconst EARLY_EXIT_HOLD_SCORE=0\.55;\n", "", s)
          s=re.sub(r"\nfunction earlyMomentumExitSignal\(.*?\n}\nasync function manageEarlyMomentumExits\(.*?\n}\n", "\n", s, flags=re.S)
          s=s.replace("const SL_PIPS=100;\n", "const SL_PIPS=100;\nconst BREAK_EVEN_ARM_PIPS=50;\nconst BREAK_EVEN_BUFFER_PIPS=0;\n")
          be_fn='''\nasync function manageBreakEvenProtection(positions,reference){\n const pip=brokerPipSize();\n for(const p of positions){\n  const id=idOf(p),side=sideOf(p),open=Number(p.openPrice);\n  if(!id||!side||!Number.isFinite(open))continue;\n  const pp=profitPips(p,reference);\n  if(!Number.isFinite(pp)||pp<BREAK_EVEN_ARM_PIPS)continue;\n  const target=normalizePrice(side==='BUY'?open+BREAK_EVEN_BUFFER_PIPS*pip:open-BREAK_EVEN_BUFFER_PIPS*pip);\n  const current=Number(p.stopLoss);\n  const improved=side==='BUY'?(Number.isFinite(current)&&current>0?current<target:true):(Number.isFinite(current)&&current>0?current>target:true);\n  if(!improved)continue;\n  try{\n   await connection.modifyPosition(id,target,Number(p.takeProfit)||undefined);\n   setStatus(`BREAK-EVEN — ${side} protected at entry after +${pp.toFixed(1)} pips`);\n  }catch(e){setStatus(`Break-even update failed: ${errorText(e)}`);}\n }\n}\n'''
          marker='\nclass BotListener extends SynchronizationListener{'
          if 'function manageBreakEvenProtection' not in s:
              s=s.replace(marker,be_fn+marker,1)
          # Replace any previous early-exit tick call with break-even protection only.
          s=s.replace('if(positions.length){await manageEarlyMomentumExits(positions,mid);await manageMomentumExits(positions,mid,bid,ask,Date.now());}', 'if(positions.length){await manageBreakEvenProtection(positions,mid);await manageMomentumExits(positions,mid,bid,ask,Date.now());}')
          s=s.replace('await manageEarlyMomentumExits(positions,mid);', 'await manageBreakEvenProtection(positions,mid);')
          p.write_text(s)
          print('growth-room strategy patch applied')
          PY
          if git diff --quiet -- web/main.js; then
            echo 'Strategy already patched; no source commit needed.'
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add web/main.js
            git commit -m 'Give positions room to grow and protect at break-even'
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build MetaApi browser bundle
        run: |
          npm install
          npm run build:web
          test -s web-dist/bundle.js
          mkdir -p app/src/main/assets
          cp web/index.html app/src/main/assets/index.html
          cp web-dist/bundle.js app/src/main/assets/bundle.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
          test -n "${ANDROID_HOME:-}" || exit 1
          test -x "$ANDROID_HOME/platform-tools/adb" || exit 1
          ls -la "$ANDROID_HOME/platforms" | head -20
          ls -la "$ANDROID_HOME/build-tools" | head -20

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.PIPSLIFE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.PIPSLIFE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.PIPSLIFE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.PIPSLIFE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.PIPSLIFE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.PIPSLIFE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.PIPSLIFE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"
          test -s app/build/outputs/apk/release/app-release.apk
          test ! -e app/build/outputs/apk/debug/app-debug.apk

      - name: Verify release APK
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'classes.dex'

      - name: Read app version
        id: version
        run: |
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Publish public release asset for updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Pips-life Multi-bot ${{ steps.version.outputs.version_name }}" \
            --notes "Signed in-place update release. Version code ${{ steps.version.outputs.version_code }}." \
            --latest
          gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk#Pips-life-Multi-bot.apk --clobber
          RELEASE_ID="$(gh release view "$TAG" --json databaseId --jq '.databaseId')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f "make_latest=true" \
            -f "name=Pips-life Multi-bot ${{ steps.version.outputs.version_name }}" \
            -f "body=Signed in-place update release. Version code ${{ steps.version.outputs.version_code }}."

      - uses: actions/upload-artifact@v4
        with:
          name: Multi-bot-release-apk
          path: app/build/outputs/apk/release/app-release.apk
