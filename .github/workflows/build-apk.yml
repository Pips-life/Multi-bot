name: Build Android APK

on:
  push:
    branches: [ main, fixed-sl-tp-direction-20260904 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply momentum entry and pre-loss exit strategy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/main.js')
          s=p.read_text()
          changed=False
          if 'const MIN_ENTRY_SPACING_PIPS=10;' in s:
              s=s.replace('const MIN_ENTRY_SPACING_PIPS=10;', 'const MIN_ENTRY_SPACING_PIPS=3;\nconst EARLY_EXIT_LOOKBACK_TICKS=4;\nconst EARLY_EXIT_MIN_PROFIT_PIPS=2;\nconst EARLY_EXIT_MIN_ADVERSE_PIPS=1.5;\nconst EARLY_EXIT_HOLD_SCORE=0.55;')
              changed=True
          marker='\nclass BotListener extends SynchronizationListener{'
          fn='''\nfunction earlyMomentumExitSignal(position,signal,reference){\n const side=sideOf(position),pp=profitPips(position,reference),pip=brokerPipSize();\n if(!side||!Number.isFinite(pp)||pp>=MOMENTUM_ARM_PIPS)return false;\n if(signal.side===side&&signal.score>=EARLY_EXIT_HOLD_SCORE&&((side==='BUY'&&signal.velocityPips>0)||(side==='SELL'&&signal.velocityPips<0)))return false;\n const recent=priceHistory.slice(-EARLY_EXIT_LOOKBACK_TICKS).map(x=>Number(x.mid));\n if(recent.length<EARLY_EXIT_LOOKBACK_TICKS)return false;\n const net=(recent.at(-1)-recent[0])/pip;\n const adverse=side==='BUY'?-net:net;\n const directionalLoss=signal.side&&signal.side!==side;\n const momentumStalled=signal.side===''||signal.score<EARLY_EXIT_HOLD_SCORE;\n if(pp>=EARLY_EXIT_MIN_PROFIT_PIPS&&(adverse>=EARLY_EXIT_MIN_ADVERSE_PIPS||directionalLoss||momentumStalled))return true;\n if(pp<=EARLY_EXIT_MIN_PROFIT_PIPS&&adverse>=EARLY_EXIT_MIN_ADVERSE_PIPS)return true;\n return false;\n}\nasync function manageEarlyMomentumExits(positions,reference){\n for(const p of positions){\n  const id=idOf(p);if(!id)continue;\n  const signal=directionSignal();\n  if(!earlyMomentumExitSignal(p,signal,reference))continue;\n  const pp=profitPips(p,reference);\n  setStatus(`EARLY EXIT — ${sideOf(p)} momentum faded${Number.isFinite(pp)?` at ${pp>=0?'+':''}${pp.toFixed(1)} pips`:''}`);\n  try{await connection.closePosition(id);}catch(e){setStatus(`Early exit failed: ${errorText(e)}`);}\n }\n}\n'''
          if 'function manageEarlyMomentumExits' not in s:
              s=s.replace(marker,fn+marker,1)
              changed=True
          old='if(positions.length)await manageMomentumExits(positions,mid,bid,ask,Date.now());reconcile();'
          new='if(positions.length){await manageEarlyMomentumExits(positions,mid);await manageMomentumExits(positions,mid,bid,ask,Date.now());}reconcile();'
          if old in s:
              s=s.replace(old,new,1)
              changed=True
          p.write_text(s)
          print('strategy patch changed:', changed)
          PY

          if git diff --quiet -- web/main.js; then
            echo 'Strategy already patched; no source commit needed.'
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add web/main.js
            git commit -m 'Tighten entries and add pre-loss momentum exit'
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build MetaApi browser bundle
        run: |
          npm install
          npm run build:web
          test -s web-dist/bundle.js
          mkdir -p app/src/main/assets
          cp web/index.html app/src/main/assets/index.html
          cp web-dist/bundle.js app/src/main/assets/bundle.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
          test -n "${ANDROID_HOME:-}" || exit 1
          test -x "$ANDROID_HOME/platform-tools/adb" || exit 1
          ls -la "$ANDROID_HOME/platforms" | head -20
          ls -la "$ANDROID_HOME/build-tools" | head -20

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.PIPSLIFE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.PIPSLIFE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.PIPSLIFE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.PIPSLIFE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.PIPSLIFE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.PIPSLIFE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.PIPSLIFE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"
          test -s app/build/outputs/apk/release/app-release.apk
          test ! -e app/build/outputs/apk/debug/app-debug.apk

      - name: Verify release APK
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'classes.dex'

      - name: Read app version
        id: version
        run: |
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Publish public release asset for updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Pips-life Multi-bot ${{ steps.version.outputs.version_name }}" \
            --notes "Signed in-place update release. Version code ${{ steps.version.outputs.version_code }}." \
            --latest
          gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk#Pips-life-Multi-bot.apk --clobber
          RELEASE_ID="$(gh release view "$TAG" --json databaseId --jq '.databaseId')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f "make_latest=true" \
            -f "name=Pips-life Multi-bot ${{ steps.version.outputs.version_name }}" \
            -f "body=Signed in-place update release. Version code ${{ steps.version.outputs.version_code }}."

      - uses: actions/upload-artifact@v4
        with:
          name: Multi-bot-release-apk
          path: app/build/outputs/apk/release/app-release.apk
