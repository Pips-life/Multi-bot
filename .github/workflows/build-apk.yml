name: Build Android APK

on:
  push:
    branches: [ main, quick-reversal-010ms ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate live trading protection logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('web/main.js').read_text()
          required = [
              "const TAKE_PROFIT_PIPS = 130;",
              "connection.modifyPosition(pid,undefined,target)",
              "const TRAIL_PIPS = 100;",
              "createStopSellOrder",
              "createStopBuyOrder",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Protection validation failed: ' + ', '.join(missing))
          print('Protection validation passed: broker-side 130-pip TP + independent STOP management')
          PY

      - name: Build MetaApi browser bundle
        run: |
          npm install
          npm run build:web
          test -s web-dist/bundle.js
          mkdir -p app/src/main/assets
          cp web/index.html app/src/main/assets/index.html
          cp web-dist/bundle.js app/src/main/assets/bundle.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
          test -n "${ANDROID_HOME:-}" || exit 1
          test -x "$ANDROID_HOME/platform-tools/adb" || exit 1
          ls -la "$ANDROID_HOME/platforms" | head -20
          ls -la "$ANDROID_HOME/build-tools" | head -20

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Multi-bot-js-sdk-apk
          path: app/build/outputs/apk/debug/app-debug.apk
