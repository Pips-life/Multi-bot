name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply trading reversal fix
        run: |
          python3 .github/scripts/fix_reversal.py

      - name: Apply MetaApi credential fix
        run: |
          python3 .github/scripts/fix_credentials.py

      - name: Build MetaApi browser bundle
        run: |
          npm install
          npm run build:web
          test -s web-dist/bundle.js
          mkdir -p app/src/main/assets
          cp web/index.html app/src/main/assets/index.html
          cp web-dist/bundle.js app/src/main/assets/bundle.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RELEASE APK
        run: gradle assembleRelease --stacktrace

      - name: Locate release APK
        run: |
          set -e
          mkdir -p release-apk
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "Found: $APK"
          cp "$APK" release-apk/app-release-unsigned.apk
          ls -lh release-apk/app-release-unsigned.apk

      - name: Restore persistent release signing key
        uses: actions/cache@v4
        with:
          path: release-apk/pips-life-release.jks
          key: pips-life-release-signing-v1

      - name: Create release signing key if missing
        run: |
          set -e
          if [ ! -f release-apk/pips-life-release.jks ]; then
            keytool -genkeypair -v \
              -keystore release-apk/pips-life-release.jks \
              -storepass pipslife-release \
              -keypass pipslife-release \
              -alias pipslife \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Pips-life, OU=Multi-bot, O=Pips-life, L=Kenya, C=KE'
          else
            echo 'Reusing persistent Pips-life release signing key'
          fi

      - name: Sign RELEASE APK
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks release-apk/pips-life-release.jks \
            --ks-pass pass:pipslife-release \
            --key-pass pass:pipslife-release \
            --ks-key-alias pipslife \
            --out release-apk/app-release.apk \
            release-apk/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose release-apk/app-release.apk
          file release-apk/app-release.apk
          ls -lh release-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Multi-bot-release-apk
          path: release-apk/app-release.apk
