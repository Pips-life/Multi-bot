name: One-time strategy update
on:
  push:
    branches: [ fixed-sl-tp-direction-20260904 ]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixed-sl-tp-direction-20260904
      - name: Update trading logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/main.js')
          s=p.read_text()
          s=s.replace("const TRAILING_SL_PIPS=70;", "const TRAILING_SL_PIPS=100;\nconst TAKE_PROFIT_PIPS=200;\nconst DIRECTION_CONFIRMATIONS=3;")
          s=s.replace("const reversalCounts=new Map();", "const reversalCounts=new Map();\nlet directionCandidate='';\nlet directionConfirmations=0;")
          old="function directionSignal(){if(priceHistory.length<SLOW_EMA+2)return {side:'',score:0};const mids=priceHistory.map(x=>x.mid),fast=ema(mids.slice(-FAST_EMA*2),FAST_EMA),slow=ema(mids.slice(-SLOW_EMA*2),SLOW_EMA);const side=fast>slow?'BUY':fast<slow?'SELL':'';return {side,score:side?1:0};}"
          new="""function directionSignal(){
            if(priceHistory.length<SLOW_EMA+8)return {side:'',score:0,confirmed:false};
            const mids=priceHistory.map(x=>x.mid);
            const fastSeries=mids.slice(-FAST_EMA*2);
            const slowSeries=mids.slice(-SLOW_EMA*2);
            const fast=ema(fastSeries,FAST_EMA),slow=ema(slowSeries,SLOW_EMA);
            const fastPrev=ema(fastSeries.slice(0,-5),FAST_EMA);
            const slowPrev=ema(slowSeries.slice(0,-5),SLOW_EMA);
            const fastSlope=fast-fastPrev,slowSlope=slow-slowPrev;
            const deltas=momentumDeltas.slice(-MOMENTUM_WINDOW);
            const momentum=deltas.reduce((a,b)=>a+b,0);
            const price=mids[mids.length-1];
            const buyScore=(fast>slow?1:0)+(fastSlope>0?1:0)+(slowSlope>0?1:0)+(momentum>0?1:0)+(candleSide==='BUY'?1:0)+(price>fast?1:0);
            const sellScore=(fast<slow?1:0)+(fastSlope<0?1:0)+(slowSlope<0?1:0)+(momentum<0?1:0)+(candleSide==='SELL'?1:0)+(price<fast?1:0);
            let side='';
            if(buyScore>=4&&buyScore>sellScore)side='BUY';
            else if(sellScore>=4&&sellScore>buyScore)side='SELL';
            const score=side==='BUY'?buyScore:side==='SELL'?sellScore:0;
            if(!side){directionCandidate='';directionConfirmations=0;return {side:'',score,confirmed:false};}
            if(side===directionCandidate)directionConfirmations++;
            else {directionCandidate=side;directionConfirmations=1;}
            return {side:directionConfirmations>=DIRECTION_CONFIRMATIONS?side:'',score,confirmed:directionConfirmations>=DIRECTION_CONFIRMATIONS};
          }"""
          if old not in s: raise SystemExit('directionSignal pattern not found')
          s=s.replace(old,new)
          old="function protectedStop(position,current){const side=sideOf(position);return side?trailingStop(side,current):undefined;}"
          new="function protectedStop(){return undefined;}"
          if old not in s: raise SystemExit('protectedStop pattern not found')
          s=s.replace(old,new)
          old="if(side==='BUY')await connection.createMarketBuyOrder(SYMBOL,volume,stopLoss,undefined,options);else await connection.createMarketSellOrder(SYMBOL,volume,stopLoss,undefined,options);"
          new="if(side==='BUY')await connection.createMarketBuyOrder(SYMBOL,volume,stopLoss,normalizePrice(reference+TAKE_PROFIT_PIPS*brokerPipSize()),options);else await connection.createMarketSellOrder(SYMBOL,volume,stopLoss,normalizePrice(reference-TAKE_PROFIT_PIPS*brokerPipSize()),options);"
          if old not in s: raise SystemExit('order pattern not found')
          s=s.replace(old,new)
          s=s.replace("setStatus(`OPEN ${side} ${volume} — 3s COOL-OFF | SL ${INITIAL_SL_PIPS}p | TRAIL ${TRAILING_SL_PIPS}p`);", "setStatus(`OPEN ${side} ${volume} — 3s COOL-OFF | SL ${INITIAL_SL_PIPS}p | TP ${TAKE_PROFIT_PIPS}p`);")
          s=s.replace("setStatus(`HOLDING ${positions.length}/${MAX_POSITIONS} ${heldSide} | MOMENTUM HOLDS | TRAIL ${TRAILING_SL_PIPS}p`);", "setStatus(`HOLDING ${positions.length}/${MAX_POSITIONS} ${heldSide} | MOMENTUM HOLDS | SL ${INITIAL_SL_PIPS}p | TP ${TAKE_PROFIT_PIPS}p`);")
          p.write_text(s)
          PY
      - name: Bump app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text().replace("versionCode 15; versionName '2.4'", "versionCode 16; versionName '2.5'")
          p.write_text(s)
          PY
      - name: Commit strategy update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/main.js app/build.gradle
          git commit -m 'Use fixed 100 pip SL 200 pip TP with advanced direction detection'
          git push origin fixed-sl-tp-direction-20260904
