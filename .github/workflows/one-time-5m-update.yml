name: One-time 5m update
on:
  push:
    branches: [ fixed-sl-tp-direction-20260904 ]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update strategy timeframe and release version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/main.js')
          s=p.read_text()
          old='const CANDLE_MS=60000;'
          new='const CANDLE_MS=300000;'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          else:
              print('CANDLE_MS already updated; no change needed')

          p=Path('app/build.gradle')
          s=p.read_text()
          if "versionCode 14" in s and "versionName '2.3'" in s:
              s=s.replace('versionCode 14','versionCode 15',1).replace("versionName '2.3'","versionName '2.4'",1)
              p.write_text(s)
          else:
              print('Release version already advanced; no change needed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/main.js app/build.gradle
          git diff --cached --quiet || (git commit -m 'Use 5-minute execution timeframe and release v2.4' && git push)
